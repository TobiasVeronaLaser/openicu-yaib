[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openicu-yaib"
version = "0.1.0"
description = "Convert OpenICU concept parquets to YAIB-compatible mortality dynamic wide tables."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "jupyter>=1.0.0",
]

[project.scripts]
openicu-yaib = "openicu_yaib.cli:main"
openicu-yaib-dyn = "openicu_yaib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
